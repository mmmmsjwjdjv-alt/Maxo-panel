name: Build DRAGON APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Prepare Keystore and Environment
        run: |
          touch .env
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p build-output
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          echo "Found APK: $APK_FILE"
          cp "$APK_FILE" build-output/DRAGON.apk

      - name: Upload DRAGON APK
        uses: actions/upload-artifact@v4
        with:
          name: DRAGON-APK
          path: build-output/DRAGON.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish Direct APK to GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "DRAGON APK Build"
          body: "Direct download of compiled DRAGON.apk"
          files: build-output/DRAGON.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
